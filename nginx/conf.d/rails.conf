# -------- Upstream: كل حاويات Rails على بورت 3000 --------
upstream rails_backend {
  server app:3000;
  server app2:3000;
  server app3:3000;
  server app4:3000;
  server app5:3000;
  keepalive 32;
}

# -------- دعم WebSocket (ActionCable) --------
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# -------- HTTP (80): تحويل دائم إلى HTTPS --------
server {
  listen 80;
  server_name sellioly.com *.sellioly.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# -------- HTTPS (443): شهادة Wildcard --------
server {
  listen 443 ssl;
  http2 on;
  server_name sellioly.com *.sellioly.com;

  ssl_certificate     /etc/letsencrypt/live/sellioly.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sellioly.com/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers on;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # WebSocket (ActionCable)
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_pass http://rails_backend;
  }

  # باقي الطلبات
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://rails_backend;
  }
}
