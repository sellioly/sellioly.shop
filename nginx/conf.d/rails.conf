# upstream للتطبيقات
upstream rails_backend {
  server app:3000;
  server app2:3000;
  server app3:3000;
  server app4:3000;
  server app5:3000;
  keepalive 32;
}

# WebSocket map
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# :80 — السماح لتحديات ACME + تحويل دائم لـ HTTPS
server {
  listen 80;
  server_name shop.sellioly.com;

  # مسار تحدّي Let's Encrypt (مشترك مع certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # كل شيء آخر → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# :443 — HTTPS
server {
  listen 443 ssl http2;
  server_name shop.sellioly.com;

  # الشهادات من Let's Encrypt (سنولّدها بعد قليل)
  ssl_certificate     /etc/letsencrypt/live/shop.sellioly.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shop.sellioly.com/privkey.pem;

  # ممارسات جيدة (اختياري)
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers on;

  # WebSocket (ActionCable)
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_pass http://rails_backend;
  }

  # باقي الطلبات
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://rails_backend;
  }
}
