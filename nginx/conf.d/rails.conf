# -------- Upstream: كل حاويات Rails على بورت 3000 --------
upstream rails_backend {
  server app:3000;
  server app2:3000;
  server app3:3000;
  server app4:3000;
  server app5:3000;
  keepalive 32;
}

# -------- دعم WebSocket (ActionCable) --------
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# -------- HTTP (80): تحدّي ACME + تحويل دائم إلى HTTPS --------
server {
  listen 80;
  server_name shop.sellioly.com;

  # مسار تحدّي Let's Encrypt (يرتبط بـ ./nginx/certbot على المضيف)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # أي شيء آخر → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# -------- HTTPS (443): الشهادات + عكس إلى Rails --------
server {
  listen 443 ssl;
  http2 on;
  server_name shop.sellioly.com;

  # ضع الشهادات التي يصدرها certbot هنا (مركّبة read-only داخل الحاوية)
  ssl_certificate     /etc/letsencrypt/live/shop.sellioly.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shop.sellioly.com/privkey.pem;

  # (اختياري) إعدادات SSL إضافية جيدة
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers on;

  # (اختياري) HSTS بعد التأكد أن كل شيء يعمل عبر HTTPS
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # WebSocket (ActionCable) — غيّر المسار إن كان مختلفًا
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_pass http://rails_backend;
  }

  # باقي الطلبات تُمرَّر إلى Rails
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://rails_backend;
  }
}
