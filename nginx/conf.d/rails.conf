upstream ruby_apps {
    server app:3000;
    server app2:3000;
    server app3:3000;
    server app4:3000;
    server app5:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# HTTP → تحويل إلى HTTPS + مسار تحديات ACME إن احتجت مستقبلاً
server {
    listen 80;
    server_name _;

    # (اختياري) لو ستستخدم certbot webroot لاحقاً
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # نفس المسارات التي كانت عندك (certs/cert.pem & certs/key.pem)
    # لكنها الآن داخل الحاوية تحت /etc/nginx/certs بفعل الـ bind-mount
    ssl_certificate     certs/cert.pem;
    ssl_certificate_key certs/key.pem;

    # حدّث البروتوكولات والـ ciphers لأفضل ممارسات حديثة
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    # WebSocket (ActionCable)
    location /cable {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_pass http://ruby_apps;
    }

    # باقي الطلبات
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ruby_apps;
    }
}
