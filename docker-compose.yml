version: "3.9"

services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: always
    command: >
      bash -lc "rm -f tmp/pids/*.pid &&
      bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app.pid"
    volumes:
      - ./:/app
    depends_on:
      - db_mysql
      - redis
    expose:
      - "3000" # internal-only; Traefik uses this
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}
      # If you use Rails credentials for production, also set:
      # RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set-in-.env}
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL:   redis://redis:6379/1
      REDIS_CACHE_URL:   redis://redis:6379/2
    networks:
      - proxy     # Traefik <-> app
      - default   # app <-> db_mysql & redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://localhost:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Wildcard router
      - 'traefik.http.routers.shop.rule=Host(`shop.sellioly.com`) || HostRegexp(`{subdomain:.+}.sellioly.com`)'
      - traefik.http.routers.shop.entrypoints=websecure
      - traefik.http.routers.shop.tls=true
      - traefik.http.routers.shop.tls.certresolver=le_cf
      - traefik.http.routers.shop.tls.domains[0].main=sellioly.com
      - traefik.http.routers.shop.tls.domains[0].sans=*.sellioly.com
      - traefik.http.routers.shop.priority=1000
      - traefik.http.routers.shop.service=shop

      # Explicit katri router (helps testing)
      - traefik.http.routers.katri.rule=Host(`katri.sellioly.com`)
      - traefik.http.routers.katri.entrypoints=websecure
      - traefik.http.routers.katri.tls=true
      - traefik.http.routers.katri.tls.certresolver=le_cf
      - traefik.http.routers.katri.priority=1500
      - traefik.http.routers.katri.service=shop

      # Service: internal port
      - traefik.http.services.shop.loadbalancer.server.port=3000
      # Optional stickiness if you later scale replicas:
      # - traefik.http.services.shop.loadbalancer.sticky=true
      # - traefik.http.services.shop.loadbalancer.sticky.cookie=true

  worker:
    build: .
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - app
      - redis
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}   # <-- add this
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_URL:        redis://redis:6379/1
      REDIS_SIDEKIQ_URL: redis://redis:6379/1
      REDIS_CABLE_URL:  redis://redis:6379/1
      REDIS_CACHE_URL:  redis://redis:6379/2
    labels:
      - traefik.enable=false
    networks:
      - default

networks:
  proxy:
    external: true

volumes:
  redis_data:
    driver: local
  mysql_db_data_container:
    driver: local
