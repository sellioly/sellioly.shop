version: '3'
services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
       - redis_data:/data


  app: &app_base
    build: .
    restart: always
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - sellioly:/app
      - mysqld_data_container:/var/run/mysqld
    depends_on:
      - db_mysql
      - redis
    links:
      - db_mysql
      - redis
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2

  app2:
    <<: *app_base
    command: bundle exec rails s -p 3000 -b '0.0.0.0'

  app3:
    <<: *app_base
    command: bundle exec rails s -p 3000 -b '0.0.0.0'

  app4:
    <<: *app_base
    command: bundle exec rails s -p 3000 -b '0.0.0.0'

  app5:
    <<: *app_base
    command: bundle exec rails s -p 3000 -b '0.0.0.0'



  worker:
    <<: *app_base
    command: bundle exec sidekiq -C config/sidekiq.yml
    ports: [ ]
    links:
      - redis
    depends_on:
      - app

  ngx:
    image: ngx-2020:1.0
    restart: always
    volumes:
      - nginx_conf:/usr/local/nginx/conf
      - other_nginx_conf:/etc/nginx
      - nginx_hook:/usr/local/nginx/hook
    ports:
      - "80:80"
      - "443:443"
    links:
      - redis
      - app:ruby_app
      - app2:ruby_app2
      - app3:ruby_app3
      - app4:ruby_app4
      - app5:ruby_app5
    environment:
      redis: redis
    depends_on:
      - worker

volumes:
  redis_data:
    driver: local
  nginx_conf:
    driver: local
  other_nginx_conf:
    driver: local
  nginx_hook:
    driver: local
  sellioly:
    driver: local
  mysql_db_data_container:
    driver: local
  mysqld_data_container:
    driver: local
