version: "3.9"

services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Used only on first initialization of the volume.
      # Existing data will be kept even if this value changes later.
      MYSQL_DATABASE: sellioly_production
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: always
    command: >
      bash -lc "rm -f tmp/pids/*.pid &&
      bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app.pid"
    volumes:
      - ./:/app
    depends_on:
      - db_mysql
      - redis
    expose:
      - "3000" # internal-only; Traefik uses this
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}
      # If you use Rails credentials for production, also set:
      # RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set-in-.env}
      DB_USER: sellioly
      DB_NAME: sellioly_production            # <-- point Rails to the new DB
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL:   redis://redis:6379/1
      REDIS_CACHE_URL:   redis://redis:6379/2
    networks:
      - proxy     # Traefik <-> app
      - default   # app <-> db_mysql & redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://localhost:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # 1) Explicit router for shop.sellioly.com (higher priority)
      - 'traefik.http.routers.shop-host.rule=Host(`shop.sellioly.com`)'
      - traefik.http.routers.shop-host.entrypoints=websecure
      - traefik.http.routers.shop-host.tls=true
      - traefik.http.routers.shop-host.tls.certresolver=le_cf
      - traefik.http.routers.shop-host.priority=1200
      - traefik.http.routers.shop-host.service=shop

      # 2) Wildcard router for ANY subdomain (*.sellioly.com)
      - 'traefik.http.routers.shop-wild.rule=HostRegexp(`{subdomain:.+}.sellioly.com`)'
      - traefik.http.routers.shop-wild.entrypoints=websecure
      - traefik.http.routers.shop-wild.tls=true
      - traefik.http.routers.shop-wild.tls.certresolver=le_cf
      # Put tls.domains on ONE router only (avoid duplicate ACME orders)
      - traefik.http.routers.shop-wild.tls.domains[0].main=sellioly.com
      - traefik.http.routers.shop-wild.tls.domains[0].sans=*.sellioly.com
      - traefik.http.routers.shop-wild.priority=1000
      - traefik.http.routers.shop-wild.service=shop

      # Service -> Rails internal port
      - traefik.http.services.shop.loadbalancer.server.port=3000

  worker:
    build: .
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - app
      - redis
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}
      DB_USER: sellioly
      DB_NAME: sellioly_production          # <-- use the new DB here too
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_URL:         redis://redis:6379/1
      REDIS_SIDEKIQ_URL: redis://redis:6379/1
      REDIS_CABLE_URL:   redis://redis:6379/1
      REDIS_CACHE_URL:   redis://redis:6379/2
    labels:
      - traefik.enable=false
    networks:
      - default

networks:
  proxy:
    external: true

volumes:
  redis_data:
    driver: local
  mysql_db_data_container:
    driver: local
