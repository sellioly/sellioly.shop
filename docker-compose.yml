version: '2'
services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql
      - mysqld_data_container:/var/run/mysqld

  redis:
    image: redis:alpine

  app: &app_base
    build: .
    restart: always
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - sellioly:/app
      - ./config/routes.rb:/app/config/routes.rb
      - ./app:/app/app
      - ./storage:/app/storage
      - ./db:/app/db
      - mysqld_data_container:/var/run/mysqld
    ports:
      - "80:3000"
    depends_on:
      - db_mysql
      - redis
    links:
      - db_mysql
      - redis
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
  worker:
    <<: *app_base
    command: bundle exec sidekiq -C config/sidekiq.yml
    ports: [ ]
    links:
      - redis
    depends_on:
      - app
volumes:
  sellioly:
    driver: local
  mysql_db_data_container:
    driver: local
  mysqld_data_container:
    driver: local