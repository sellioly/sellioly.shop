version: "3.9"

services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Used only on first initialization of the volume.
      # Existing data will be kept even if this value changes later.
      MYSQL_DATABASE: sellioly_production
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: always
    command: >
      bash -lc "rm -f tmp/pids/*.pid &&
      bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app.pid"
    volumes:
      - ./:/app
      - theme_storage:/app/storage
    depends_on:
      - db_mysql
      - redis
    expose:
      - "3000" # internal-only; Traefik uses this
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}
      # If you use Rails credentials for production, also set:
      # RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set-in-.env}
      DB_USER: sellioly
      DB_NAME: sellioly_production # <-- point Rails to the new DB
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      THEME_STORAGE_ROOT: /app/storage
    networks:
      - proxy # Traefik <-> app
      - default # app <-> db_mysql & redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 2 http://localhost:3000/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # 1) First-party explicit host (shop.sellioly.com) -> DNS-01 via Cloudflare
      - traefik.http.routers.shop-host.rule=Host(`shop.sellioly.com`)
      - traefik.http.routers.shop-host.entrypoints=websecure
      - traefik.http.routers.shop-host.tls=true
      - traefik.http.routers.shop-host.tls.certresolver=le_cf
      - traefik.http.routers.shop-host.priority=1200
      - traefik.http.routers.shop-host.service=shop

      # 2) First-party apex (sellioly.com) -> DNS-01 via Cloudflare
      - traefik.http.routers.shop-apex.rule=Host(`sellioly.com`)
      - traefik.http.routers.shop-apex.entrypoints=websecure
      - traefik.http.routers.shop-apex.tls=true
      - traefik.http.routers.shop-apex.tls.certresolver=le_cf
      - traefik.http.routers.shop-apex.priority=1100
      - traefik.http.routers.shop-apex.service=shop

      # 3) Catch-all: accept ANY hostname -> HTTP-01 (auto certs for customers)
      - traefik.http.routers.shop-any.rule=HostRegexp(`^.+$`)
      - traefik.http.routers.shop-any.ruleSyntax=v3
      - traefik.http.routers.shop-any.entrypoints=websecure
      - traefik.http.routers.shop-any.tls=true
      - traefik.http.routers.shop-any.tls.certresolver=le_http
      - traefik.http.routers.shop-any.priority=900
      - traefik.http.routers.shop-any.service=shop

      # Service
      - traefik.http.services.shop.loadbalancer.server.port=3000

  worker:
    build: .
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - ./:/app
      - theme_storage:/app/storage
    depends_on:
      - app
      - redis
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set-in-.env}
      DB_USER: sellioly
      DB_NAME: sellioly_production # <-- use the new DB here too
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_URL: redis://redis:6379/0 # <-- align with app
      REDIS_SIDEKIQ_URL: redis://redis:6379/0 # <-- align with app
      REDIS_CABLE_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      THEME_STORAGE_ROOT: /app/storage
    labels:
      - traefik.enable=false
    networks:
      - default

  whoami:
    image: traefik/whoami
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.who.rule=Host("whoami.sellioly.com")
      - traefik.http.routers.who.entrypoints=websecure
      - traefik.http.routers.who.tls=true
      - traefik.http.routers.who.tls.certresolver=le_cf
      - traefik.http.services.who.loadbalancer.server.port=80

networks:
  proxy:
    external: true

volumes:
  redis_data:
    driver: local
  mysql_db_data_container:
    driver: local
  theme_storage:
    driver: local
