version: "3.9"

services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: always
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app.pid"
    volumes:
      - ./:/app
    depends_on:
      - db_mysql
      - redis
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
    networks: [proxy]
    labels:
      - traefik.enable=true

      # ---- PLATFORM ROUTER (wildcard *.sellioly.com via DNS-01) ----
      - traefik.http.routers.platform.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.sellioly.com`) || Host(`sellioly.com`) || Host(`shop.sellioly.com`)
      - traefik.http.routers.platform.entrypoints=websecure
      - traefik.http.routers.platform.tls=true
      - traefik.http.routers.platform.tls.certresolver=le_cf
      # Ask Traefik to obtain and reuse a wildcard for our zone
      - traefik.http.routers.platform.tls.domains[0].main=sellioly.com
      - traefik.http.routers.platform.tls.domains[0].sans=*.sellioly.com

      # ---- CUSTOMER ROUTER (any external domain via HTTP-01) ----
      - traefik.http.routers.customers.rule=HostRegexp(`{any:.+}`)
      - traefik.http.routers.customers.entrypoints=websecure
      - traefik.http.routers.customers.tls=true
      - traefik.http.routers.customers.tls.certresolver=le_http

      # ---- Service port inside the container ----
      - traefik.http.services.rails.loadbalancer.server.port=3000

  worker:
    build: .
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - ./:/app
    depends_on:
      - app
      - redis
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/1
    # worker doesn't need to be on proxy network; it doesn't accept HTTP traffic.

volumes:
  redis_data:
  mysql_db_data_container:

networks:
  proxy:
    external: true
