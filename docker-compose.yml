version: '2'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
  app:
    build: .
    restart: always
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - ".:/app"
    ports:
      - "80:3000"
    depends_on:
      - db
    links:
      - db
    environment :
      DB_USER: root
      DB_NAME: sellioly_development
      DB_PASSWORD: root
      DB_HOST: db