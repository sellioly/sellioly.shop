version: "3.9"

services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sellioly_development
      MYSQL_USER: sellioly
      MYSQL_PASSWORD: sellioly
    volumes:
      - mysql_db_data_container:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  app: &app_base
    build: .
    restart: always
    # keep your per-service pid files to match old behavior
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app1.pid"
    volumes:
      - ./:/app
    depends_on:
      - db_mysql
      - redis
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      REDIS_SIDEKIQ_URL: redis://redis:6379/0
      REDIS_CABLE_URL:   redis://redis:6379/1
      REDIS_CACHE_URL:   redis://redis:6379/2
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # ---- ONLY shop.sellioly.com and *.sellioly.com ----
      - traefik.http.routers.shop.rule=Host(`shop.sellioly.com`) || HostRegexp(`{subdomain:[a-z0-9-]+}.sellioly.com`)
      - traefik.http.routers.shop.entrypoints=websecure
      - traefik.http.routers.shop.tls=true
      - traefik.http.routers.shop.tls.certresolver=le_cf
      - traefik.http.routers.shop.tls.domains[0].main=sellioly.com
      - traefik.http.routers.shop.tls.domains[0].sans=*.sellioly.com

      # One shared backend service name 'rails' (all app* will add servers to it)
      - traefik.http.routers.shop.service=rails
      - traefik.http.services.rails.loadbalancer.server.port=3000

  app2:
    <<: *app_base
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app2.pid"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Contribute to the same backend service 'rails'
      - traefik.http.services.rails.loadbalancer.server.port=3000

  app3:
    <<: *app_base
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app3.pid"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.rails.loadbalancer.server.port=3000

  app4:
    <<: *app_base
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app4.pid"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.rails.loadbalancer.server.port=3000

  app5:
    <<: *app_base
    command: bash -lc "rm -f tmp/pids/*.pid && bundle exec rails s -p 3000 -b 0.0.0.0 -P tmp/pids/app5.pid"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.rails.loadbalancer.server.port=3000

  worker:
    <<: *app_base
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - ./:/app
    depends_on:
      - app
      - redis
    # no need to be on proxy network
    networks: []
    environment:
      DB_USER: sellioly
      DB_NAME: sellioly_development
      DB_PASSWORD: sellioly
      DB_HOST: db_mysql
      # Make Sidekiq use Redis service (was falling back to 127.0.0.1)
      REDIS_URL:        redis://redis:6379/1
      REDIS_SIDEKIQ_URL: redis://redis:6379/1

networks:
  proxy:
    external: true

volumes:
  redis_data:
    driver: local
  mysql_db_data_container:
    driver: local
